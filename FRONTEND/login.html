<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart Study Planner - Login</title>
    <link rel="manifest" href="manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        body { 
            margin: 0; 
            overflow-x: hidden; 
            background-color: #0A0F15; 
            font-family: 'Inter', sans-serif;
        }

        /* Override/Refine some styles for the login page specifically */
        .auth-page-body {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }

        .split-layout {
            display: flex;
            flex-direction: column;
            width: 100%;
            min-height: 100vh;
            position: relative;
            z-index: 10;
        }

        @media (min-width: 1024px) {
            .split-layout { flex-direction: row; }
        }

        .hero-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 3rem 1.5rem;
            color: white;
            text-align: center;
            z-index: 2;
        }

        @media (min-width: 1024px) {
            .hero-section { padding: 5rem 6rem; text-align: left; }
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 2rem;
            justify-content: center;
        }

        @media (min-width: 1024px) {
            .logo-container { justify-content: flex-start; }
        }

        .logo-text {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(to right, #FFFFFF, #6EE7B7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
        }

        @media (min-width: 1024px) {
            .logo-text { font-size: 3.5rem; }
        }

        .subtitle-text {
            font-size: 1.1rem;
            color: #9CA3AF;
            margin-bottom: 2rem;
            font-weight: 300;
        }

        @media (min-width: 1024px) {
            .subtitle-text { font-size: 1.4rem; margin-bottom: 4rem; }
        }

        .quote-container {
            display: flex;
            gap: 0.75rem;
            margin: 2rem 0;
            justify-content: center;
        }

        @media (min-width: 1024px) {
            .quote-container { justify-content: flex-start; margin-bottom: auto; }
        }

        .quote-content {
            font-size: 1.25rem;
            font-weight: 300;
            line-height: 1.5;
            max-width: 500px;
            color: #E5E7EB;
        }

        @media (min-width: 1024px) {
            .quote-content { font-size: 1.75rem; max-width: 550px; }
        }

        .auth-container-wrapper {
            width: 100%;
            padding: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
        }

        @media (min-width: 1024px) {
            .auth-container-wrapper { width: 550px; padding-right: 4rem; }
        }

        .auth-section {
            width: 100%;
            max-width: 450px;
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-left: 3px solid #6EE7B7;
            border-radius: 20px;
            padding: 2.5rem 2rem;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 10px 50px rgba(0,0,0,0.5);
        }

        .auth-nav {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
            display: flex;
            gap: 0.5rem;
        }

        .btn-nav {
            padding: 0.5rem 1rem;
            font-size: 0.75rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            border: none;
            transition: 0.2s;
        }
        .btn-nav-active { background: #6EE7B7; color: #064E3B; }
        .btn-nav-inactive { background: rgba(255,255,255,0.05); color: white; border: 1px solid rgba(255,255,255,0.1); }

        .auth-title {
            font-size: 1.5rem;
            font-weight: 500;
            color: white;
            margin-top: 1rem;
            margin-bottom: 1.5rem;
        }

        .footer-text {
            font-size: 0.8rem;
            color: #6B7280;
            margin-top: 2rem;
        }

        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .glow-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.1) 0%, rgba(0,0,0,0) 70%);
            z-index: 1;
            pointer-events: none;
        }
    </style>
</head>
<body class="auth-page">

    <canvas id="bg-canvas"></canvas>
    <div class="glow-overlay"></div>

    <div class="split-layout">
        <!-- Hero Section -->
        <div class="hero-section">
            <div class="logo-container">
                <div class="logo-icon">
                    <div style="position: absolute; width:22px; height:22px; background:#A7F3D0; border-radius:4px; top:0; left:0;"></div>
                    <div style="position: absolute; width:22px; height:22px; background:#FBCFE8; border-radius:4px; top:6px; left:6px; opacity:0.9;"></div>
                    <div style="position: absolute; width:22px; height:22px; background:#60A5FA; border-radius:4px; top:12px; left:12px; opacity:0.9;"></div>
                </div>
                <div class="logo-text" style="margin-left: 2rem;">SmartPlanner</div>
            </div>
            
            <div class="subtitle-text">
                Plan smarter. <span style="color:#6EE7B7; font-weight:600;">Learn faster.</span> Achieve more.
            </div>

            <div class="quote-container">
                <div style="font-size:3rem; color:rgba(110,231,183,0.3); line-height:1; font-family:serif;">“</div>
                <div style="text-align: left;">
                     <div class="quote-content" id="quote-display">
                        Education is the most powerful weapon which you can use to change the world.
                     </div>
                     <div style="margin-top:1rem; font-size:1rem; color:#6EE7B7; font-style:italic;" id="quote-author">— Nelson Mandela</div>
                </div>
            </div>
            
            <div class="footer-text">
                Trusted by students worldwide.
            </div>
        </div>

        <!-- Auth Section -->
        <div class="auth-container-wrapper">
            <div class="auth-section">
                <div class="auth-nav">
                    <button type="button" class="btn-nav btn-nav-active" id="btn-nav-signin">Sign In</button>
                    <button type="button" class="btn-nav btn-nav-inactive" id="btn-nav-signup">Sign Up</button>
                </div>

                <h2 class="auth-title" id="form-title">Welcome Back</h2>
                
                <form id="auth-form">
                    <div class="input-group" id="name-group" style="display: none;">
                        <label class="input-label" for="name">Full Name</label>
                        <input type="text" id="name" class="input-field" placeholder="John Doe">
                    </div>
                    
                    <div class="input-group">
                        <label class="input-label" for="email">Email Address</label>
                        <input type="email" id="email" class="input-field" placeholder="you@example.com" required>
                    </div>
                    
                    <div class="input-group">
                        <label class="input-label" for="password">Password</label>
                        <input type="password" id="password" class="input-field" placeholder="••••••••" required>
                    </div>
                    
                    <div id="error-message" style="color: #EF4444; font-size: 0.875rem; margin-top: 1rem; display: none; text-align:center;"></div>
                    
                    <button type="submit" class="btn btn-primary" id="submit-btn" style="margin-top: 1rem; background: linear-gradient(135deg, #A7F3D0, #34D399); color: #064E3B;">Sign In</button>
                </form>
                
                <div style="text-align:center; color:#9CA3AF; font-size:0.875rem; margin-top:1.5rem; cursor:pointer;" id="forgot-pass">Forgot password?</div>
            </div>
        </div>
    </div>

    <script src="api-client.js"></script>
    <script src="login.js"></script>
</body>
</html>
